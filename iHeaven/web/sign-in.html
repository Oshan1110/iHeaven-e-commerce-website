<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In - iHeaven</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.css">
    </head>

    <body class="bg-gray-100 font-sans">
        <!-- Navigation -->
        <nav class="bg-black text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fab fa-apple text-2xl text-white"></i>
                    <a href="#" class="text-2xl font-bold text-white">iHeaven</a>
                </div>
            </div>
        </nav>

        <!-- Auth Container -->
        <div class="container mx-auto px-4 py-12">
            <div class="flex flex-col md:flex-row items-center justify-center gap-8">
                <!-- Hero Section -->
                <div
                    class="w-full md:w-1/2 flex flex-col items-center md:items-start text-center md:text-left mb-8 md:mb-0">
                    <h1 class="text-5xl font-bold mb-4 text-apple-gradient">Welcome to iHeaven</h1>
                    <p class="text-xl text-gray-600 mb-8">Your exclusive destination for authentic Apple products.
                        Experience innovation at its finest.</p>

                    <div class="relative w-full max-w-md h-64">
                        <img src="https://www.apple.com/v/macbook-air-m1/e/images/overview/hero_endframe__ea0qze85eyi6_large.jpg"
                             alt="Apple Products" class="absolute top-0 left-0 w-full h-full object-contain floating">
                    </div>

                    <div class="mt-8 grid grid-cols-3 gap-4">
                        <div class="flex flex-col items-center">
                            <i class="fas fa-shield-alt text-3xl text-gray-700 mb-2"></i>
                            <span class="text-sm">100% Authentic</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="fas fa-truck text-3xl text-gray-700 mb-2"></i>
                            <span class="text-sm">Free Shipping</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="fas fa-headset text-3xl text-gray-700 mb-2"></i>
                            <span class="text-sm">24/7 Support</span>
                        </div>
                    </div>
                </div>

                <!-- Sign In Form -->
                <div class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-black to-gray-800 p-6">
                        <h2 class="text-2xl font-bold text-white">Sign In to iHeaven</h2>
                        <p class="text-gray-300">Access your account to continue shopping</p>
                    </div>
                    <form class="p-6">
                        <div class="text-xs text-red-500 mb-4" id="message"></div>
                        <div class="mb-4">
                            <label for="loginEmail" class="block text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                        </div>
                        <div class="mb-6">
                            <label for="loginPassword" class="block text-gray-700 mb-2">Password</label>
                            <div class="relative">
                                <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                <!--<button type="button" class="absolute right-3 top-3 text-gray-500"><i class="far fa-eye"></i></button>-->
                            </div>
                            <div class="flex justify-between items-center mt-2">
                                <a href="otp-code.html" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
                            </div>
                        </div>
                        <button type="button" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800" onclick="signIn();">Sign In</button>
                        <div class="text-center text-sm text-gray-600 mt-4">
                            Don't have an account? <a href="sign-up.html" class="text-blue-600 hover:underline">Sign Up</a>
                        </div>
                    </form>
                </div>
            </div>
            <script src="assets/js/script.js"></script>
            <script src="assets/js/SignIn.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>
    </body>

</html>
